# ASIC configuration for the Dell S6000-ON (BCM56850, Trident II).
#
# Broadcom's config.bcm content, answered to the SDK one property at a time.
#
# NOTHING KEYED ON A PORT IS HERE, AND NOTHING KEYED ON A PORT MAY BE.
#
# Dell's SONiC config.bcm for this board has 652 lines, and 632 of them end in
# a port: portmap_N, xgxs_{rx,tx}_lane_map_N, phy_xaui_{rx,tx}_polarity_flip_N,
# and serdes_{preemphasis,driver_current,pre_driver_current}_laneK_xeN. Those
# describe how this board is wired, are vendor-derived, and come from
# tools/mkconf.sh into portmap.conf, polarity.conf and serdes.conf. The daemon
# loads those beside this file and refuses to start without portmap.conf.
#
# What is below is the rest: how this MODEL configures the ASIC. Values marked
# "vendor" are Dell's, from sonic-buildimage 202012
# device/dell/x86_64-dell_s6000_s1220-r0/Force10-S6000/td2-s6000-32x40G.config.bcm;
# the rest are NOSaic's and say why.
#
# ⚠ NONE OF THIS HAS RUN ON AN S6000 YET.

# Poll rather than take an interrupt through the SDK: NOSaic's BDE maps the
# BAR from userspace and has no IRQ to hand it, as on both td2 siblings.
# miim_intr_enable and schan_intr_enable are vendor, and agree.
polled_irq_mode=1
miim_intr_enable.0=0
schan_intr_enable=0

# ⚠ NO load_firmware, NO phy_* FIRMWARE KEYS. The siblings need them for
# external PHYs; this board has none -- every cage is on the ASIC's own
# SerDes -- and Dell's file sets none.

# Which logical ports may exist: bits 1-106, Dell's own bitmap from every
# S6000 SKU. Wider than the 32 a 40G layout uses, because tools/mkconf.sh
# --breakout gives a broken-out cage four logical numbers and renumbers the
# cages after it; the SDK creates only the ports the map names.
pbmp_xport_xe.0=0x000007fffffffffffffffffffffffffe

# Vendor sets oversubscription on the same bitmap. 32 x 40G is 1.28 Tb/s, the
# chip's line rate, so nothing is actually oversubscribed; kept because it is
# the vendor's proven configuration and changes the MMU's scheduling mode.
pbmp_oversubscribe.0=0x000007fffffffffffffffffffffffffe

# Table sizes: vendor.
l2_mem_entries.0=32768
l3_mem_entries.0=16384
ipv6_lpm_128b_enable.0=1
max_vp_lags.0=0
module_64ports.0=0

# ⚠ ALPM IS OFF, AND THAT IS A DEPARTURE FROM THE VENDOR.
#
# Dell sets l3_alpm_enable=2 and l3_alpm_hit_skip=1. Neither td2 sibling runs
# ALPM, and it changes how every route is laid out in the chip -- the part of
# the datapath that mirrors the kernel's routes is proven only without it.
# Start where the proven path is; turn it on later on purpose, with a test.
#l3_alpm_enable=2
#l3_alpm_hit_skip=1

# Vendor.
higig2_hdr_mode.0=1
parity_enable=1
parity_correction=1
bcm_num_cos=10
bcm_stat_interval=2000000
l2xmsg_mode.0=1
l2xmsg_hostbuf_size=8192
lls_num_l2uc=12
mmu_lossless=0
tdma_timeout_usec.0=5000000
os=unix

# Port policy, matching what SONiC's Broadcom SAI does to this chip after
# init (re/notes/init-gap.md, from the SAI's own disassembly). NOSaic keys,
# read by datapath/td2/sdk.c; the td2 siblings run without them.
#
# Pause off on every port: the SDK's MAC init turns TX and RX pause on, so a
# neighbour's PAUSE frames can stall a port. SAI turns it off.
nosaic_pause=off
# Software linkscan, as SAI runs it on a Trident II, and the one TD2 PHY
# workaround SAI applies: software RX loss-of-signal, which only runs when
# linkscan polls. Without it a reseated cable or optic can leave a port up
# and passing nothing.
nosaic_linkscan_mode=sw
nosaic_rx_los=1
# Leave each 40G port's interface type as the SDK set it. On this board
# that is XGMII -- `bcmcmd ps` under SONiC shows every 40G port XGMII, and
# the SAI never rewrites it -- which the td2 bring-up would otherwise take for
# "not 40G" and rewrite to SR4.
nosaic_port_interface=keep

# Deliberately absent:
#   sai_adjust_acl_drop_in_rx_drop   SAI's, not the SDK's
#   stable_size                      the SDK's warm-boot scache; NOSaic cold-boots
#   stat_if_parity_enable            a Dune statistics-interface knob; no code
#                                    in OpenBCM 6.5.24 reads it on Trident II

# Front-panel interfaces are NOT here. Their logical port numbers depend on
# which cages run as 4x10G, so tools/mkconf.sh writes the tap_ lines into
# portmap.conf with the map they belong to: et<cage>, or et<cage>_1..4 for a
# broken-out cage.
