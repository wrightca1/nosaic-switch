# NOSaic board port. Copy this directory to platform/<id>/ and fill it in.
# The directory name must match `id`.

id: dell-s6000-on  # unique, matches the directory name
vendor: dell  # e.g. arista, accton, juniper
model: s6000-on  # e.g. 7050sx2-72q

# The orthogonal axes. arch and boot name directories (arch/<arch>, boot/<boot>);
# asic selects which nosd provider this board installs.
arch: x86_64  # x86_64 | aarch64 | powerpc | armhf
asic: td2  # e.g. td2p, td2, tdp, helix4, prestera, virt
# x86 ONIE with legacy BIOS GRUB. NOSaic's partitions go beside ONIE's on
# the same disk, found by GPT name, exactly as SONiC installs.
boot: onie-grub

# Only for boot: uboot. Where in RAM the kernel is loaded, which is a property
# of the SoC -- there is no safe default, and a wrong one hangs the board with
# nothing on the console.
# u_boot_arch: ppc
# u_boot_load: "0x01000000"
# u_boot_entry: "0x01000000"

# Only for boot: aboot. The newest Arista hardware epoch this image claims to
# support; Aboot refuses a board whose epoch is higher. Read it off the switch
# with prefdl. Defaults to 1.
# aboot_max_hwepoch: "1"

profile: minimal  # full | slim | minimal
kernel: ""                   # empty means the fleet default

# The boot partition holds the kernel, initramfs and GRUB here, not only
# the slot pointer. The disk is a CFast card behind a Marvell 88SE9170
# (AHCI, so /dev/sda); its size is not recorded yet -- the Step 2 log of the
# first unit will say. The layout needs about 3.1 GiB beside ONIE.
boot_mib: 64
slot_mib: 1024
data_mib: 1024

# ── Platform HAL ────────────────────────────────────────────────────────────
#
# A userspace driver (internal/platformhal/s6000): it drives the GPIO-selected
# i2c mux and the CPLDs itself and reads every sensor directly, so NO kernel
# hwmon driver may be bound behind the mux. See that package's doc.
#
# The buses, read off a running unit (gmrproxsw02, SONiC 202012,
# /sys/bus/i2c/devices): the mux parent is NOT an iSMT. SONiC's i2c-2 is the
# LPC bridge's legacy SCH SMBus, 00:1f.0/isch_smbus.N/i2c-2, and the CPLDs,
# sensors, fans and all 32 QSFPs are behind it; i2c-1 is iSMT 00:13.1 with
# the PSUs; iSMT 00:13.0 carries nothing. The driver still checks at open by
# reading the system CPLD.
platform_hal:
  driver: dell-s6000
  # The BCM56850, read off a running unit (lspci: 01:00.0 [14e4:b850] rev 03).
  # On PCIe from power-on here -- there is no release to wait for -- and
  # stated so the interrupt binding (asic-irq) and `nosaic platform schan`
  # can find it. Interrupts themselves stay polled for the first run
  # (asic.conf); see docs/todo.md.
  asic_pci: "0000:01:00.0"
  dell_s6000:
    mux_parent: "0000:00:1f.0"
    psu_bus: "0000:00:13.1"
    gpio_chip: sch_gpio
    # Dell's fancontrol.sh idles at 7000 of 19000 RPM (37%).
    fan_floor_percent: 40

# The cooling band, against the hottest of the tmp75s, the S1220's dies and
# the DIMM. Not measured on a unit: the first run's `nosaic platform thermal
# --once` output is what to tune this against.
#
# For reference, what Dell's SONiC does (fancontrol.sh, every 5 s): the
# AVERAGE of the three tmp75s, stepped --
#     <=25 C  7000 rpm   26-44 C 10000   45-59 C 13000   60-79 C 16000
#     >=80 C 19000 rpm, and a software shutdown ("Thermal Overload")
# with 16200 rpm if any tray reads under 1000 rpm, and 15000 rpm at boot.
# Measured on gmrproxsw02 under SONiC: board sensors 29-34 C, CPU 28-32 C,
# DIMM 31 C, fans at 10031 rpm (52%). This band reads the hottest sensor and
# ramps linearly from the 40% floor at 25 C to 100% at 75 C: ~51% at that
# box's 34 C and ~82% at 60 C, against Dell's 10000 and 16000 rpm steps.
thermal:
  min_c: 25
  max_c: 75
  slew_down_percent: 5
  interval_seconds: 10

status: planned              # planned | bringup | experimental | production

# Only what the SONiC 202012 image states outright. The DMA reservation
# (memmap=64M$...) is deliberately absent: it has to be read off this board's
# own e820, and a wrong one segfaults nosd rather than failing to map.
# reboot=p: the kernel's reboot is a full cold reset through port 0xCF9 --
# exactly what Dell's SONiC does on this board -- and the fallback if the CPLD
# power cycle in shutdown cannot run. intel_iommu=off: off by default in this
# kernel already, stated because the userspace BDE hands the ASIC physical
# addresses and an IOMMU turned on later would break DMA silently.
#
# memmap=64M$0xb0000000: the DMA pool nosd-td2 claims through /dev/mem, read
# off a unit's own e820 (gmrproxsw02, SONiC 202012):
#   BIOS-e820: [mem 0x0000000000100000-0x00000000bed0cfff] usable
# 64 MB at 0xb0000000 is inside that, below 4 GB (the SDK here has no 64-bit
# DMA), and clear of the kernel, which sits above 4 GB. SONiC's kernel BDE
# put its 32 MB at 0xb8c00000 on the same box; any usable range will do.
# The onie-grub backend escapes the $ for GRUB.
kernel_params: "processor.max_cstate=1 intel_idle.max_cstate=0 reboot=p intel_iommu=off memmap=64M$0xb0000000 iomem=relaxed"

notes: >
  Dell S6000-ON: Intel Atom S1220, BCM56850 Trident2 (14e4:b850 at 01:00.0),
  32x QSFP+ on direct SerDes. No retimers, gearboxes or external PHYs, so
  SerDes tuning is preemphasis and driver current only.

  ⚠ Boots through onie-grub, not onie-sfx. ONIE shares the disk here, and
  onie-sfx would dd over it. The backend is modelled on SONiC's installer.

  ⚠ Reboot must be a full reset, never a warm one: the CPLD power cycle
  (0x31 reg 0x01 = 0xfd) as Dell's ONIE does, or a 0xCF9 cold reset as
  Dell's SONiC does. See kernel_params and hardware.md.

  ⚠ The QSFP I2C "mux" is the CPLDs, not a pca954x: an active-low one-hot
  modsel written to slave 0x33 regs 0x00/0x01 (ports 0-15) and master 0x32
  regs 0x0a/0x0b (ports 16-31). All of it sits behind a 74CBTLV3253 GPIO mux
  (GPIO 1, 2) on the S1200's iSMT SMBus. GPIO 10 resets it after a failed
  transfer.

  Source: sonic-buildimage 202012, platform/broadcom/sonic-platform-modules-dell/s6000.
  None of this has been observed under NOSaic yet.
